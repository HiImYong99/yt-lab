<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #080808; color: #f2f2f0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    position: relative;
  }
  body::before {
    content: ""; position: absolute; top: -220px; left: 50%;
    width: 1100px; height: 620px; transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(255,255,255,.075), transparent 72%);
  }
  .wrap { position: relative; padding: 62px 64px 0; height: 100%; display: flex; flex-direction: column; }
  .mark { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; font-size: 27px; letter-spacing: -.02em; }
  .mark .dot { color: #d8ff36; }
  h1 { font-size: 63px; line-height: 1.08; letter-spacing: -.035em; font-weight: 700; margin-top: 40px; }
  .lead { font-size: 24px; color: #b9b9b9; margin-top: 20px; letter-spacing: -.01em; }
  .stats { display: flex; gap: 62px; margin-top: 42px; }
  .stat .num { font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .stat .lbl { font-size: 15px; color: #8a8a8a; margin-top: 9px; }
  .icons { position: absolute; right: 0; bottom: 0; left: 0; display: flex; gap: 14px; padding: 0 64px 44px; }
  .icons img { flex: none; width: 62px; height: 62px; border-radius: 15px; object-fit: cover; background: #1a1a1a; }
  .fade { position: absolute; right: 0; bottom: 44px; width: 190px; height: 62px; background: linear-gradient(90deg, transparent, #0a0a0a 78%); }
</style>
</head>
