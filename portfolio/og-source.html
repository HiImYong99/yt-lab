<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #080808; color: #f2f2f0;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: absolute; top: -300px; left: 8%;
    width: 900px; height: 700px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(216,255,54,.10), transparent 70%);
  }
  .wrap { position: relative; padding: 58px 64px 0; height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .mark { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
  .mark .dot { color: #d8ff36; }
  .eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #7c7c76;
    display: flex; align-items: center; gap: 12px;
  }
  .eyebrow::before { content: ""; width: 30px; height: 1px; background: #d8ff36; }
  h1 { font-size: 104px; line-height: .9; letter-spacing: -.055em; font-weight: 800; margin-top: 46px; }
  h1 .acc { color: #d8ff36; }
  .lead { font-size: 25px; line-height: 1.45; color: #c2c2bc; margin-top: 26px; letter-spacing: -.015em; max-width: 27ch; }
  .lead b { color: #f2f2f0; font-weight: 600; }
  .stats { display: flex; gap: 36px; margin-top: auto; margin-bottom: 130px; }
  .stat .num { font-size: 44px; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat:first-child .num { color: #d8ff36; }
  .stat .lbl { font-size: 15px; color: #7c7c76; margin-top: 10px; }
  .icons { position: absolute; right: 0; bottom: 0; left: 0; display: flex; gap: 13px; padding: 0 64px 44px; }
  .icons img { flex: none; width: 58px; height: 58px; border-radius: 14px; object-fit: cover; background: #151514; opacity: .6; }
  .fade { position: absolute; right: 0; bottom: 44px; width: 210px; height: 58px; background: linear-gradient(90deg, transparent, #080808 76%); }
</style>
</head>
<body>
  <div class="wrap">
